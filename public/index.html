<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 550px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 12px;
            font-size: 32px;
        }

        h2 {
            color: #1e3c72;
            font-size: 26px;
            margin-bottom: 20px;
        }

        h3 {
            color: #1e3c72;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
            font-size: 16px;
        }

        .tabs {
            display: flex;
            margin-bottom: 35px;
            border-bottom: 3px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: #666;
            border-bottom: 4px solid transparent;
            transition: all 0.3s;
            font-size: 16px;
            font-weight: 600;
        }

        .tab.active {
            color: #06b6d4;
            border-bottom-color: #06b6d4;
        }

        .tab:hover {
            background: #f8f9fa;
        }

        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 15px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            padding: 14px;
            margin-bottom: 24px;
            border-radius: 8px;
            display: none;
            font-size: 15px;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-info p {
            color: #666;
            font-size: 15px;
            margin-top: 5px;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            padding: 12px 24px;
            width: auto;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .logout-btn:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .product-form {
            background: #f8fafc;
            padding: 28px;
            border-radius: 12px;
            margin-bottom: 28px;
            border: 2px solid #e2e8f0;
        }

        .products-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .product-item {
            background: #f8fafc;
            padding: 20px;
            margin-bottom: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: start;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

        .product-item:hover {
            border-color: #06b6d4;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.1);
        }

        .product-info h3 {
            margin-bottom: 8px;
            color: #1e3c72;
            font-size: 19px;
        }

        .product-info p {
            margin: 5px 0;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }

        .product-actions {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .btn-small {
            padding: 10px 18px;
            font-size: 14px;
            width: auto;
            font-weight: 600;
        }

        .btn-edit {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 3px 10px rgba(245, 158, 11, 0.3);
        }

        .btn-edit:hover {
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 3px 10px rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #666;
            font-size: 16px;
        }

        .empty-state::before {
            content: "📦";
            display: block;
            font-size: 50px;
            margin-bottom: 15px;
        }

        /* Scrollbar personalizado */
        .products-list::-webkit-scrollbar {
            width: 8px;
        }

        .products-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .products-list::-webkit-scrollbar-thumb {
            background: #06b6d4;
            border-radius: 10px;
        }

        .products-list::-webkit-scrollbar-thumb:hover {
            background: #0891b2;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .product-item {
                flex-direction: column;
                gap: 15px;
            }

            .product-actions {
                width: 100%;
            }

            .btn-small {
                flex: 1;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div id="authSection">
            <h1>🛍️ Gestión de Productos</h1>
            <p class="subtitle">Sistema de administración de inventario</p>

            <div class="tabs">
                <div class="tab active" onclick="showTab('login')">Iniciar Sesión</div>
                <div class="tab" onclick="showTab('register')">Registrarse</div>
            </div>

            <div id="message" class="message"></div>

            <!-- Login Form -->
            <div id="loginForm" class="form-content active">
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" required placeholder="Mínimo 6 caracteres">
                    </div>
                    <button type="submit">Iniciar Sesión</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-content">
                <form onsubmit="register(event)">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="registerName" required placeholder="Tu nombre completo">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="registerEmail" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="registerPassword" required minlength="6" placeholder="Mínimo 6 caracteres">
                    </div>
                    <button type="submit">Registrarse</button>
                </form>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" class="dashboard">
            <div class="dashboard-header">
                <div class="user-info">
                    <h2>Panel de Productos</h2>
                    <p id="userName"></p>
                </div>
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            </div>

            <div class="product-form">
                <h3>Agregar Producto</h3>
                <form onsubmit="createProduct(event)">
                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input type="text" id="productName" required placeholder="Ej: Laptop HP 15">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <input type="text" id="productDescription" required placeholder="Describe el producto">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Precio ($)</label>
                            <input type="number" id="productPrice" step="0.01" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Stock (unidades)</label>
                            <input type="number" id="productStock" required placeholder="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="productCategory">
                            <option value="Electrónica">📱 Electrónica</option>
                            <option value="Ropa">👕 Ropa</option>
                            <option value="Alimentos">🍕 Alimentos</option>
                            <option value="Hogar">🏠 Hogar</option>
                            <option value="Deportes">⚽ Deportes</option>
                            <option value="Otros">📦 Otros</option>
                        </select>
                    </div>
                    <button type="submit">Agregar Producto</button>
                </form>
            </div>

            <h3 style="margin-bottom: 20px;">Mis Productos</h3>
            <div id="productsList" class="products-list"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('token');
        let editingProductId = null;

        // Check if user is already logged in
        if (token) {
            showDashboard();
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');
            hideMessage();
        }

        function showMessage(message, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            setTimeout(() => hideMessage(), 5000);
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        async function register(e) {
            e.preventDefault();
            const nombre = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✅ Registro exitoso! Ahora puedes iniciar sesión', 'success');
                    document.querySelectorAll('.tab')[0].click();
                    document.getElementById('registerForm').reset();
                } else {
                    showMessage('❌ ' + (data.message || 'Error en el registro'), 'error');
                }
            } catch (error) {
                showMessage('❌ Error de conexión', 'error');
            }
        }

        async function login(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    localStorage.setItem('userName', data.nombre);
                    showDashboard();
                } else {
                    showMessage('❌ ' + (data.message || 'Error en el login'), 'error');
                }
            } catch (error) {
                showMessage('❌ Error de conexión', 'error');
            }
        }

        function logout() {
            token = null;
            localStorage.removeItem('token');
            localStorage.removeItem('userName');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('loginForm').reset();
        }

        function showDashboard() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('userName').textContent = `Bienvenido, ${localStorage.getItem('userName')} 👋`;
            loadProducts();
        }

        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/products`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const products = await response.json();

                if (response.ok) {
                    displayProducts(products);
                }
            } catch (error) {
                console.error('Error cargando productos:', error);
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('productsList');
            
            if (products.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay productos aún. ¡Agrega tu primer producto!</div>';
                return;
            }

            container.innerHTML = products.map(product => `
                <div class="product-item">
                    <div class="product-info">
                        <h3>${product.nombre}</h3>
                        <p><strong>📝 Descripción:</strong> ${product.descripcion}</p>
                        <p><strong>💰 Precio:</strong> $${product.precio.toFixed(2)} | <strong>📦 Stock:</strong> ${product.stock} unidades</p>
                        <p><strong>🏷️ Categoría:</strong> ${product.categoria}</p>
                    </div>
                    <div class="product-actions">
                        <button class="btn-small btn-edit" onclick="editProduct('${product._id}')">✏️ Editar</button>
                        <button class="btn-small btn-delete" onclick="deleteProduct('${product._id}')">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        async function createProduct(e) {
            e.preventDefault();
            
            const productData = {
                nombre: document.getElementById('productName').value,
                descripcion: document.getElementById('productDescription').value,
                precio: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                categoria: document.getElementById('productCategory').value
            };

            try {
                const url = editingProductId 
                    ? `${API_URL}/products/${editingProductId}`
                    : `${API_URL}/products`;
                
                const method = editingProductId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productData)
                });

                if (response.ok) {
                    e.target.reset();
                    editingProductId = null;
                    loadProducts();
                }
            } catch (error) {
                console.error('Error guardando producto:', error);
            }
        }

        async function editProduct(id) {
            try {
                const response = await fetch(`${API_URL}/products/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const product = await response.json();

                if (response.ok) {
                    document.getElementById('productName').value = product.nombre;
                    document.getElementById('productDescription').value = product.descripcion;
                    document.getElementById('productPrice').value = product.precio;
                    document.getElementById('productStock').value = product.stock;
                    document.getElementById('productCategory').value = product.categoria;
                    editingProductId = id;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (error) {
                console.error('Error cargando producto:', error);
            }
        }

        async function deleteProduct(id) {
            if (!confirm('¿Estás seguro de eliminar este producto? Esta acción no se puede deshacer.')) return;

            try {
                const response = await fetch(`${API_URL}/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    loadProducts();
                }
            } catch (error) {
                console.error('Error eliminando producto:', error);
            }
        }
    </script>
</body>
</html>
